name: Reusable Aider Agent

on:
  workflow_call:
    inputs:
      issue_title:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      issue_number:
        required: true
        type: number
      target_files:
        required: false
        type: string
        default: ""
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BRANCH="agent/issue-${{ inputs.issue_number }}"
          git checkout -b "$BRANCH"
          aider --model gemini/gemini-2.5-pro \
                --no-auto-commits \
                --message "${{ inputs.issue_title }}: ${{ inputs.issue_body }}" \
                --yes ${{ inputs.target_files }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "resolve #${{ inputs.issue_number }}" || exit 0
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "${{ inputs.issue_title }}" \
            --body "Closes #${{ inputs.issue_number }}\n\nAutomated implementation via Gemini." \
            --head "agent/issue-${{ inputs.issue_number }}" \
            --base main

      - name: Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ inputs.issue_number }} --body "🚀 PR created: check open pull requests for details."
